name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Smoke-test the wheel in a clean virtualenv
        run: python scripts/smoke_wheel.py --wheel "$(ls dist/*.whl)"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
