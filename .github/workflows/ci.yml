name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the graph and `--for review` read git history

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb python3-tk

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest hatchling

      - name: Test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q

      - name: Test
        if: runner.os != 'Linux'
        run: python -m pytest -q

  wheel:
    name: wheel installs and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the wheel, install it in a clean virtualenv, run the CLI and the MCP server
        run: python -m pip install --upgrade pip build && python scripts/smoke_wheel.py

  lint:
    name: ruff (informational)
    runs-on: ubuntu-latest
    continue-on-error: true # many pre-existing findings; shown, not enforced yet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff
      - run: ruff check contexta_app contexta.py contexta_mcp.py scripts tests --output-format=github
